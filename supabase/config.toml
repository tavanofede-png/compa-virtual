project_id = "compa-virtual"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
[db]
port = 54322
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[auth]
enabled = true
site_url = "https://kusiy.vercel.app"
additional_redirect_urls = ["compavirtual://", "http://localhost:3000", "http://127.0.0.1:3000", "https://kusiy.vercel.app", "https://compa-virtual-estudio.vercel.app", "https://compa-virtual-estudio.tavanofede.chatgpt.site"]
enable_signup = true
[auth.email]
enable_signup = true
enable_confirmations = true
[storage]
enabled = true
file_size_limit = "50MiB"
[functions.api]
verify_jwt = true
[functions.reminders]
verify_jwt = false
[functions.material-process]
verify_jwt = true
[functions.family-consent]
verify_jwt = false
[functions.voice]
verify_jwt = true
