services:
  - type: worker
    name: compa-materials
    runtime: docker
    region: virginia
    plan: standard
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: .
    numInstances: 1
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-astra
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: MINOR_BETA_APPROVED
        value: "false"
      - key: OPENAI_ZDR_VERIFIED
        value: "false"
      - key: DIGITAL_CONSENT_AGE
        value: "18"

